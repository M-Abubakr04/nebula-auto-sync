image: atlassian/default-image:3

pipelines:
  default:
    - step:
        name: Sync Bitbucket to GitHub
        script:
          - apt-get update && apt-get install -y git

          - git config --global user.name "Bitbucket-Pipeline"
          - git config --global user.email "pipeline@nebula.local"

          - if [ -z "$GITHUB_TOKEN" ]; then echo "GITHUB_TOKEN is missing"; exit 1; fi

          - git remote remove github || true
          - git remote add github https://x-access-token:$GITHUB_TOKEN@github.com/M-Abubakr04/nebula-auto-sync.git

          - git fetch github || true

          - git push github HEAD:$BITBUCKET_BRANCH --force --no-verify
